<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#111;color:#f0f0f0;font-family:'Inter',sans-serif;font-size:16px}

/* NAV */
nav{background:#1a1a1a;padding:.9rem 1.25rem;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #2d2d2d;position:sticky;top:0;z-index:50}
.logo{font-family:'Rajdhani',sans-serif;font-size:clamp(1.1rem,4vw,1.4rem);font-weight:700}
.logo span{color:#c8e63c}
.cart-btn{background:none;border:1.5px solid #c8e63c;color:#c8e63c;padding:.35rem .9rem;border-radius:8px;cursor:pointer;font-family:'Rajdhani',sans-serif;font-size:clamp(.85rem,3vw,1rem);font-weight:600;white-space:nowrap}
.cart-btn:hover{background:#c8e63c;color:#111}

/* HERO */
.hero{padding:clamp(2rem,6vw,4rem) clamp(1rem,5vw,2rem);text-align:center;border-bottom:1px solid #2d2d2d}
.hero h1{font-family:'Rajdhani',sans-serif;font-size:clamp(2rem,8vw,3rem);font-weight:700;line-height:1.1;margin-bottom:.75rem}
.hero h1 span{color:#c8e63c}
.hero p{color:#888;font-size:clamp(.85rem,3vw,.95rem);margin-bottom:1.5rem}
.hero-btns{display:flex;gap:.75rem;justify-content:center;flex-wrap:wrap}
.btn-y{background:#c8e63c;color:#111;border:none;padding:.6rem 1.4rem;border-radius:8px;font-family:'Rajdhani',sans-serif;font-size:clamp(.9rem,3vw,1rem);font-weight:700;cursor:pointer}
.btn-y:hover{background:#d4f040}
.btn-g{background:none;border:1.5px solid #4caf50;color:#4caf50;padding:.6rem 1.4rem;border-radius:8px;font-family:'Rajdhani',sans-serif;font-size:clamp(.9rem,3vw,1rem);font-weight:600;cursor:pointer}
.btn-g:hover{background:#4caf50;color:#fff}

/* SECTIONS */
section{padding:clamp(1.5rem,5vw,2.5rem) clamp(1rem,5vw,1.5rem)}
.sec-title{font-family:'Rajdhani',sans-serif;font-size:clamp(1rem,4vw,1.3rem);font-weight:700;color:#c8e63c;margin-bottom:1.25rem;letter-spacing:.5px}

/* CATEGORÍAS */
.cats{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1.25rem}
.cat{background:#1e1e1e;border:1px solid #2d2d2d;color:#888;padding:.3rem .8rem;border-radius:20px;cursor:pointer;font-size:clamp(.75rem,2.5vw,.85rem);transition:.2s}
.cat:hover,.cat.on{border-color:#c8e63c;color:#c8e63c}

/* PRODUCTOS */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(160px,100%),1fr));gap:.85rem}
.card{background:#1e1e1e;border:1px solid #2d2d2d;border-radius:10px;padding:1rem;transition:.2s}
.card:hover{border-color:#4caf50}
.card-icon{font-size:clamp(1.75rem,5vw,2rem);margin-bottom:.5rem}
.card-name{font-size:clamp(.82rem,2.5vw,.9rem);font-weight:600;margin-bottom:.2rem}
.card-desc{font-size:clamp(.7rem,2vw,.75rem);color:#666;margin-bottom:.6rem;line-height:1.4}
.card-foot{display:flex;align-items:center;justify-content:space-between;gap:.5rem;flex-wrap:wrap}
.price{font-family:'Rajdhani',sans-serif;font-size:clamp(1rem,3vw,1.1rem);color:#c8e63c;font-weight:700}
.add{background:#4caf50;color:#fff;border:none;padding:.3rem .7rem;border-radius:6px;cursor:pointer;font-size:clamp(.72rem,2vw,.8rem);font-weight:600;white-space:nowrap}
.add:hover{background:#43a047}

/* SERVICIOS */
.svc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(200px,100%),1fr));gap:.85rem}
.svc{background:#1e1e1e;border:1px solid #2d2d2d;border-radius:10px;padding:1.25rem}
.svc-icon{font-size:clamp(1.5rem,4vw,1.75rem);margin-bottom:.5rem}
.svc h3{font-family:'Rajdhani',sans-serif;font-size:clamp(.9rem,3vw,1rem);font-weight:700;margin-bottom:.3rem}
.svc p{font-size:clamp(.72rem,2vw,.78rem);color:#666;line-height:1.4;margin-bottom:.5rem}
.svc-price{font-size:clamp(.8rem,2.5vw,.85rem);color:#4caf50;font-weight:600}

/* CONTACTO */
.contact-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(140px,100%),1fr));gap:.75rem}
.cinfo{background:#1e1e1e;border:1px solid #2d2d2d;border-radius:10px;padding:1rem 1.25rem}
.ci-label{font-size:clamp(.65rem,2vw,.72rem);color:#666;margin-bottom:.25rem}
.ci-val{font-size:clamp(.82rem,2.5vw,.9rem);font-weight:600;color:#c8e63c}

/* FOOTER */
footer{padding:1.25rem;text-align:center;border-top:1px solid #2d2d2d;color:#444;font-size:clamp(.7rem,2vw,.78rem)}
footer strong{color:#c8e63c;font-family:'Rajdhani',sans-serif;font-weight:700}

/* CARRITO OVERLAY */
.cart-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:200;display:none}
.cart-overlay.open{display:block}
.cart-panel{position:absolute;right:0;top:0;bottom:0;width:min(320px,100vw);background:#1a1a1a;border-left:1px solid #2d2d2d;padding:1.25rem;overflow-y:auto;display:flex;flex-direction:column}
.cart-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.25rem}
.cart-head h2{font-family:'Rajdhani',sans-serif;font-size:clamp(1rem,4vw,1.2rem)}
.close{background:none;border:none;color:#888;cursor:pointer;font-size:1.3rem}
.close:hover{color:#f0f0f0}
.ci{display:flex;gap:.75rem;align-items:center;padding:.6rem 0;border-bottom:1px solid #2d2d2d}
.ci-ico{font-size:1.4rem;width:32px;flex-shrink:0}
.ci-info{flex:1;min-width:0}
.ci-name{font-size:clamp(.78rem,2.5vw,.85rem);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ci-p{font-size:.75rem;color:#c8e63c}
.ci-qty{display:flex;align-items:center;gap:.4rem;margin-top:.3rem}
.qb{background:#222;border:1px solid #333;color:#f0f0f0;width:22px;height:22px;border-radius:5px;cursor:pointer;font-size:.9rem;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.qb:hover{border-color:#c8e63c}
.ci-rm{background:none;border:none;color:#555;cursor:pointer;font-size:.9rem;padding:0 .2rem}
.ci-rm:hover{color:#e53935}
.cart-bot{margin-top:1rem;padding-top:1rem;border-top:1px solid #2d2d2d}
.total{display:flex;justify-content:space-between;font-family:'Rajdhani',sans-serif;font-size:clamp(1rem,4vw,1.2rem);font-weight:700;margin-bottom:.75rem}
.total span:last-child{color:#c8e63c}
.chk{width:100%;background:#c8e63c;color:#111;border:none;padding:.7rem;border-radius:8px;font-family:'Rajdhani',sans-serif;font-size:clamp(.9rem,3vw,1rem);font-weight:700;cursor:pointer}
.chk:hover{background:#d4f040}
.empty{text-align:center;color:#555;padding:2rem 0;font-size:.85rem}

/* TOAST */
.toast{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%) translateY(60px);background:#4caf50;color:#fff;padding:.5rem 1.25rem;border-radius:8px;font-size:clamp(.78rem,3vw,.85rem);font-weight:600;z-index:300;transition:.35s;opacity:0;white-space:nowrap}
.toast.on{transform:translateX(-50%) translateY(0);opacity:1}

/* MOBILE overrides */
@media(max-width:480px){
  .grid{grid-template-columns:1fr 1fr}
  .svc-grid{grid-template-columns:1fr}
  .contact-row{grid-template-columns:1fr 1fr}
  .hero-btns{flex-direction:column;align-items:center}
  .btn-y,.btn-g{width:100%;max-width:260px;text-align:center}
}
@media(max-width:320px){
  .grid{grid-template-columns:1fr}
  .contact-row{grid-template-columns:1fr}
}
</style>
</head>
<body>

<nav>
  <div class="logo">BLACK <span>TECH</span></div>
  <button class="cart-btn" onclick="openCart()">🛒 <span id="cc">0</span></button>
</nav>

<div class="hero">
  <h1>Tu tech,<br><span>siempre en forma.</span></h1>
  <p>Accesorios y servicio técnico en Mendoza</p>
  <div class="hero-btns">
    <button class="btn-y" onclick="scroll2('prods')">Ver productos</button>
    <button class="btn-g" onclick="scroll2('svcs')">Servicios</button>
  </div>
</div>

<section id="prods">
  <div class="sec-title">PRODUCTOS</div>
  <div class="cats" id="cats"></div>
  <div class="grid" id="grid"></div>
</section>

<section id="svcs" style="background:#161616;border-top:1px solid #2d2d2d;border-bottom:1px solid #2d2d2d">
  <div class="sec-title">SERVICIOS TÉCNICOS</div>
  <div class="svc-grid" id="svcs-grid"></div>
</section>

<section>
  <div class="sec-title">CONTACTO</div>
  <div class="contact-row">
    <div class="cinfo"><div class="ci-label">Dirección</div><div class="ci-val">Mendoza, Argentina</div></div>
    <div class="cinfo"><div class="ci-label">WhatsApp</div><div class="ci-val">+54 261 000-0000</div></div>
    <div class="cinfo"><div class="ci-label">Horarios</div><div class="ci-val">Lun–Sáb 9–20hs</div></div>
    <div class="cinfo"><div class="ci-label">Instagram</div><div class="ci-val">@blacktech.mdz</div></div>
  </div>
</section>

<footer>© 2025 <strong>BLACK TECH</strong> — Accesorios · Servicio Técnico</footer>

<div class="cart-overlay" id="overlay" onclick="closeOut(event)">
  <div class="cart-panel" id="panel">
    <div class="cart-head">
      <h2>🛒 Carrito</h2>
      <button class="close" onclick="openCart()">✕</button>
    </div>
    <div id="citems" style="flex:1;overflow-y:auto"></div>
    <div class="cart-bot" id="cbot"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const prods=[
  {id:1,cat:'Fundas',icon:'📱',name:'Funda Silicona',desc:'Protección delgada, todos los modelos',price:3500},
  {id:2,cat:'Fundas',icon:'🛡️',name:'Funda Antigolpes',desc:'TPU reforzado, bordes elevados',price:5990},
  {id:3,cat:'Cables',icon:'🔌',name:'Cable USB-C 2m',desc:'Carga rápida 65W, nylon trenzado',price:4200},
  {id:4,cat:'Cables',icon:'⚡',name:'Cable Lightning',desc:'Certificado MFi, 1.5m',price:3800},
  {id:5,cat:'Audio',icon:'🎧',name:'Auriculares BT',desc:'30hs batería, cancelación de ruido',price:12990},
  {id:6,cat:'Audio',icon:'🔊',name:'Parlante Mini',desc:'Resistente agua IPX6, 10hs',price:8990},
  {id:7,cat:'Cargadores',icon:'⚡',name:'Cargador GaN 65W',desc:'Ultra compacto, 3 puertos',price:7500},
  {id:8,cat:'Cargadores',icon:'🔋',name:'Cargador Inalámbrico',desc:'15W, compatible Qi',price:5500},
  {id:9,cat:'Pantallas',icon:'🪟',name:'Vidrio Templado 9H',desc:'Kit completo, sin burbujas',price:1800},
  {id:10,cat:'Baterías',icon:'🔋',name:'Power Bank 20.000',desc:'Carga rápida 22.5W, 2 salidas',price:11990},
];
const svcs=[
  {icon:'🔧',name:'Cambio de Pantalla',desc:'Con garantía 6 meses, servicio en el día',price:'Desde $8.000'},
  {icon:'🔋',name:'Cambio de Batería',desc:'Batería original, diagnóstico gratis',price:'Desde $5.000'},
  {icon:'💧',name:'Reparación por Agua',desc:'Limpieza ultrasónica y recuperación de datos',price:'Desde $6.500'},
  {icon:'🔌',name:'Pin de Carga',desc:'USB-C, Lightning o Micro USB',price:'Desde $3.500'},
  {icon:'🖥️',name:'Diagnóstico',desc:'Revisión completa sin costo',price:'GRATIS'},
];

let cart=[], activeCat='Todo';

function allCats(){return['Todo',...new Set(prods.map(p=>p.cat))]}

function renderCats(){
  document.getElementById('cats').innerHTML=allCats().map(c=>
    `<div class="cat${c===activeCat?' on':''}" onclick="setCat('${c}')">${c}</div>`
  ).join('');
}

function setCat(c){activeCat=c;renderCats();renderGrid();}

function renderGrid(){
  const list=activeCat==='Todo'?prods:prods.filter(p=>p.cat===activeCat);
  document.getElementById('grid').innerHTML=list.map(p=>`
    <div class="card">
      <div class="card-icon">${p.icon}</div>
      <div class="card-name">${p.name}</div>
      <div class="card-desc">${p.desc}</div>
      <div class="card-foot">
        <div class="price">$${p.price.toLocaleString('es-AR')}</div>
        <button class="add" onclick="add(${p.id})">+ Agregar</button>
      </div>
    </div>
  `).join('');
}

function renderSvcs(){
  document.getElementById('svcs-grid').innerHTML=svcs.map(s=>`
    <div class="svc">
      <div class="svc-icon">${s.icon}</div>
      <h3>${s.name}</h3>
      <p>${s.desc}</p>
      <div class="svc-price">${s.price}</div>
    </div>
  `).join('');
}

function add(id){
  const p=prods.find(x=>x.id===id);
  const ex=cart.find(x=>x.id===id);
  ex?ex.qty++:cart.push({...p,qty:1});
  document.getElementById('cc').textContent=cart.reduce((a,x)=>a+x.qty,0);
  toast('✔ '+p.name+' agregado');
}

function chQty(id,d){
  const it=cart.find(x=>x.id===id);
  if(!it)return;
  it.qty+=d;
  if(it.qty<=0)cart=cart.filter(x=>x.id!==id);
  document.getElementById('cc').textContent=cart.reduce((a,x)=>a+x.qty,0);
  renderCart();
}

function renderCart(){
  const ci=document.getElementById('citems');
  const cb=document.getElementById('cbot');
  if(!cart.length){
    ci.innerHTML='<div class="empty">🛒 El carrito está vacío</div>';
    cb.innerHTML='';
    return;
  }
  ci.innerHTML=cart.map(x=>`
    <div class="ci">
      <div class="ci-ico">${x.icon}</div>
      <div class="ci-info">
        <div class="ci-name">${x.name}</div>
        <div class="ci-p">$${x.price.toLocaleString('es-AR')}</div>
        <div class="ci-qty">
          <button class="qb" onclick="chQty(${x.id},-1)">−</button>
          <span style="font-size:.8rem;min-width:16px;text-align:center">${x.qty}</span>
          <button class="qb" onclick="chQty(${x.id},1)">+</button>
          <button class="ci-rm" onclick="chQty(${x.id},-999)">🗑</button>
        </div>
      </div>
    </div>
  `).join('');
  const total=cart.reduce((a,x)=>a+x.price*x.qty,0);
  cb.innerHTML=`
    <div class="total"><span>Total</span><span>$${total.toLocaleString('es-AR')}</span></div>
    <button class="chk" onclick="toast('¡Pedido enviado! 📱')">Finalizar pedido</button>
  `;
}

function openCart(){
  document.getElementById('overlay').classList.toggle('open');
  renderCart();
}

function closeOut(e){if(e.target===document.getElementById('overlay'))openCart();}

function scroll2(id){document.getElementById(id).scrollIntoView({behavior:'smooth'});}

let tt;
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('on');
  clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2000);
}

renderCats();renderGrid();renderSvcs();
</script>
</body>
</html>
